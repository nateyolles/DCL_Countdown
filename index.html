<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disney Cruise Countdown Timer | Flip-Card Sail Date Clock</title>
  <meta
    name="description"
    content="Count down to your Disney Cruise Line sail date with an animated flip-card timer. Pick your ship and real departure date and watch it tick down."
  />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://nateyolles.github.io/DCL_Countdown/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Disney Cruise Countdown" />
  <meta property="og:title" content="Disney Cruise Countdown Timer" />
  <meta
    property="og:description"
    content="Count down to your Disney Cruise Line sail date with an animated flip-card timer over an animated ocean scene. Pick your ship and real departure date."
  />
  <meta property="og:url" content="https://nateyolles.github.io/DCL_Countdown/" />
  <meta property="og:image" content="https://nateyolles.github.io/DCL_Countdown/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Disney Cruise Countdown Timer" />
  <meta
    name="twitter:description"
    content="Count down to your Disney Cruise Line sail date with an animated flip-card timer over an animated ocean scene."
  />
  <meta name="twitter:image" content="https://nateyolles.github.io/DCL_Countdown/assets/og-image.png" />

  <meta name="theme-color" content="#1c2b45" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://db.onlinewebfonts.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Disney Cruise Countdown Timer",
      "description": "Count down to your Disney Cruise Line sail date with an animated flip-card timer, real ship departure dates, and an animated ocean scene.",
      "url": "https://nateyolles.github.io/DCL_Countdown/",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Any"
    }
  </script>
</head>
<body>
  <canvas id="background-canvas"></canvas>
  <!-- <div class="overlay"></div> -->

  <main class="content">
    <div id="countdown" class="countdown" hidden>
      <div class="unit unit--days">
        <div id="days" class="value"><span class="digit">0</span><span class="digit">0</span></div>
        <span class="label">Days</span>
      </div>
      <div class="countdown-row">
        <div class="unit">
          <div id="hours" class="value"><span class="digit">0</span><span class="digit">0</span></div>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <div id="minutes" class="value"><span class="digit">0</span><span class="digit">0</span></div>
          <span class="label">Mins</span>
        </div>
        <div class="unit">
          <div id="seconds" class="value"><span class="digit">0</span><span class="digit">0</span></div>
          <span class="label">Secs</span>
        </div>
      </div>
    </div>
  </main>

  <button id="change-date" class="change-date" hidden>View Reservations</button>

  <div id="date-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="date-form-label">
    <div class="modal-backdrop"></div>

    <form id="cruise-form" class="date-form">
      <label id="date-form-label" for="ship-select">Choose your cruise</label>

      <select id="ship-select" required disabled>
        <option value="" disabled selected>Loading ships…</option>
      </select>

      <select id="cruise-select" required disabled>
        <option value="" disabled selected>Choose a ship first</option>
      </select>

      <button type="submit">Set</button>

      <button type="button" id="manual-date-toggle" class="link-button">
        Can't find your date? Enter one manually
      </button>
    </form>

    <p id="cruise-load-error" class="cruise-error" hidden>
      Couldn't load the cruise list. Pick your departure date manually below.
    </p>

    <form id="date-form" class="date-form" hidden>
      <label for="date-input">Count down to</label>
      <input type="date" id="date-input" required />
      <button type="submit">Set</button>
      <button type="button" id="manual-date-back" class="link-button">
        Back to cruise list
      </button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
